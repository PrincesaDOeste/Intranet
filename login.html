<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f1e6e;
            --navy-mid: #1a2f88;
            --teal: #05afaf;
            --teal-dark: #038a8a;
            --bg: #f4f6fb;
            --border: #e2e4ed;
            --text-1: #0d1340;
            --text-2: #4a5380;
            --radius-sm: 6px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(15,30,110,.06), 0 1px 2px rgba(15,30,110,.04);
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            color: var(--text-1);
            font-family: 'DM Sans', sans-serif;
        }
        .topbar {
            height: 66px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 28px;
            background: var(--navy);
            border-bottom: 1px solid var(--navy-mid);
        }
        .topbar__logo img {
            height: 50px;
            width: auto;
            display: block;
            background: #fff;
            border-radius: var(--radius-sm);
            padding: 6px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .topbar__logo-placeholder {
            height: 50px;
            display: flex;
            align-items: center;
            color: #fff;
            font-weight: 600;
        }
        .topbar__logo-placeholder em { color: var(--teal); font-style: normal; }
        .topbar__divider { width: 1px; height: 24px; background: rgba(255,255,255,.15); }
        .topbar__title {
            color: rgba(255,255,255,.65);
            font-size: 12px;
            letter-spacing: .6px;
            text-transform: uppercase;
        }
        .admin-page {
            max-width: 720px;
            padding: 34px 24px 48px;
        }
        .admin-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 24px;
        }
        h2 { color: var(--navy); font-weight: 600; }
        label { color: var(--text-2); font-weight: 500; }
        .form-control {
            border-color: var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
        }
        .form-control:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(5,175,175,.12);
        }
        .btn-primary {
            background: var(--teal);
            border-color: var(--teal);
        }
        .btn-primary:hover {
            background: var(--teal-dark);
            border-color: var(--teal-dark);
        }
        .btn-secondary {
            background: var(--navy);
            border-color: var(--navy);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar__logo">
            <img id="logoPrincipal" src="" alt="Logo" style="display:none;">
            <div class="topbar__logo-placeholder" id="logoPlaceholder">
                <span>Portal <em>Intranet</em></span>
            </div>
        </div>
        <div class="topbar__divider"></div>
        <span class="topbar__title">Portal de Comunicação</span>
    </header>

    <div class="container admin-page">
        <h2 class="mt-5">Tela de Login</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="login-form" class="mt-3 admin-card">
                    <div class="form-group">
                        <label for="username">Nome de Usuário</label>
                        <input type="text" id="username" class="form-control" placeholder="Nome de usuário" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" class="form-control" placeholder="Senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
                <!-- Botões para navegação -->
                <div class="mt-4">
                    <button class="btn btn-secondary" onclick="window.location.href='index.html'">Voltar para Home</button>
                 
                </div>
            </div>
        </div>
    </div>

    <!-- Importação do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script>
        const supabaseUrl = 'https://woywqncdfuyworcbjjlv.supabase.co'; // URL do Supabase
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndveXdxbmNkZnV5d29yY2Jqamx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUwMTUyNzgsImV4cCI6MjA2MDU5MTI3OH0.o63pZx8l8oe1aEYKEaYVQyHgEvR5FGkfAygTLTvWWVA'; // Chave API
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function carregarLogotipo() {
            const { data } = await supabaseClient
                .from('config_imagens_site')
                .select('logotipo')
                .eq('tipo', 'logo_principal')
                .order('atualizado_em', { ascending: false })
                .limit(1)
                .maybeSingle();
            if (!data || !data.logotipo) return;
            const img = document.getElementById('logoPrincipal');
            img.src = data.logotipo.startsWith('data:image') ? data.logotipo : 'data:image/png;base64,' + data.logotipo;
            img.style.display = 'block';
            document.getElementById('logoPlaceholder').style.display = 'none';
        }

        carregarLogotipo();

        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Admin Login
            if (username === 'Admin' && password === '1234') {
                window.location.href = 'cadastro.html'; // Redireciona para Cadastro
            } else {
                // Verifica no Supabase
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password);

                if (error) {
                    alert("Erro ao fazer login: " + error.message);
                } else if (data.length > 0) {
                    window.location.href = 'rh.html'; // Redireciona para página do RH
                } else {
                    alert("Usuário ou senha inválidos.");
                }
            }
        });
    </script>
</body>
</html>
