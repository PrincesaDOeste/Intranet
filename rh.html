<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página RH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<style>
    :root {
        --navy: #0f1e6e;
        --navy-mid: #1a2f88;
        --teal: #05afaf;
        --teal-dark: #038a8a;
        --bg: #f4f6fb;
        --border: #e2e4ed;
        --text-1: #0d1340;
        --text-2: #4a5380;
        --radius-sm: 6px;
        --radius-lg: 14px;
        --shadow-sm: 0 1px 3px rgba(15,30,110,.06), 0 1px 2px rgba(15,30,110,.04);
    }

    body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text-1);
        font-family: 'DM Sans', sans-serif;
    }

    .topbar {
        height: 66px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 28px;
        background: var(--navy);
        border-bottom: 1px solid var(--navy-mid);
    }

    .topbar__logo img {
        height: 50px;
        width: auto;
        display: block;
        background: #fff;
        border-radius: var(--radius-sm);
        padding: 6px 14px;
        box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .topbar__logo-placeholder {
        height: 50px;
        display: flex;
        align-items: center;
        color: #fff;
        font-weight: 600;
    }

    .topbar__logo-placeholder em { color: var(--teal); font-style: normal; }
    .topbar__divider { width: 1px; height: 24px; background: rgba(255,255,255,.15); }
    .topbar__title { color: rgba(255,255,255,.65); font-size: 12px; letter-spacing: .6px; text-transform: uppercase; }
    .admin-page { max-width: 1480px; padding: 28px 24px 48px; }
    .admin-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 24px; }
    h1, h2 { color: var(--navy); font-weight: 600; }
    label { color: var(--text-2); font-weight: 500; }
    .form-control, .form-select { border-color: var(--border); border-radius: var(--radius-sm); }
    .form-control:focus, .form-select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(5,175,175,.12); }
    .btn-primary { background: var(--teal); border-color: var(--teal); }
    .btn-primary:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
    .nav-tabs { border-bottom-color: var(--border); }
    .nav-tabs .nav-link { color: var(--text-2); border: 0; border-bottom: 2px solid transparent; }
    .nav-tabs .nav-link.active { color: var(--navy); border-bottom-color: var(--teal); font-weight: 600; }
    .list-group-item { border-color: var(--border); }
    .filter-hidden { display: none !important; }

    /* Rolagem vertical nas listas */
    .list-group {
        max-height: 300px;
        overflow-y: auto;
    }

    /* Margem na barra de busca */
    .search-bar {
        margin-bottom: 10px;
    }

    .img-preview {
        max-width: 90px;
        max-height: 60px;
        object-fit: cover;
        border-radius: 4px;
        margin-left: 8px;
    }
</style>

<body>
    <header class="topbar">
        <div class="topbar__logo">
            <img id="logoPrincipal" src="" alt="Logo" style="display:none;">
            <div class="topbar__logo-placeholder" id="logoPlaceholder">
                <span>Portal <em>Intranet</em></span>
            </div>
        </div>
        <div class="topbar__divider"></div>
        <span class="topbar__title">Portal de Comunicação</span>
    </header>

    <div class="container admin-page">
        <h1 class="text-center">Página RH</h1>
        <div class="row">
            <div class="col-md-6 admin-card">
                <h2>Cadastrar Dados</h2>
                <form id="cadastroForm">
                    <div class="mb-3">
                        <label for="tipo" class="form-label">Tipo de Cadastro</label>
                        <select id="tipo" class="form-select">
                            <option value="aniversariantes">Aniversariante</option>
                            <option value="feriados">Feriado</option>
                            <option value="cestas">Data para Cestas</option>
                            <option value="eventos">Evento</option>
                            <option value="cardapio">Cardápio</option>
                            <option value="ramais">Ramal</option>
                            <option value="identidade">Identidade</option>
                        </select>
                    </div>
                    <div id="infoCadastro">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" class="form-control" required>
                        </div>
                        <div class="mb-3" id="dataField">
                            <label for="data" class="form-label">Data</label>
                            <input type="date" id="data" class="form-control">
                        </div>
                        <div class="mb-3" id="imagemEvento" style="display:none;">
                            <label for="imagem" class="form-label">Imagem do Evento</label>
                            <input type="file" id="imagem" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3" id="imagemCardapio" style="display:none;">
                            <label for="imagemCardapioInput" class="form-label">Imagem do Cardápio</label>
                            <input type="file" id="imagemCardapioInput" class="form-control" accept="image/*">
                        </div>
                        <!-- Campos para IDENTIDADE (logotipo + imagem destaque) -->
                        <div class="mb-3" id="logoIdentidade" style="display:none;">
                            <label for="logotipo" class="form-label">Logotipo</label>
                            <input type="file" id="logotipo" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3" id="imagemIdentidade" style="display:none;">
                            <label for="imagemDestaqueIdentidade" class="form-label">Imagem de Destaque #Em
                                produção</label>
                            <input type="file" id="imagemDestaqueIdentidade" class="form-control" accept="image/*">
                        </div>
                        <!-- fim IDENTIDADE -->

                        <div class="mb-3" id="ramalFields" style="display:none;">
                            <label for="ramal" class="form-label">Ramal</label>
                            <input type="text" id="ramal" class="form-control">

                            <label for="setor" class="form-label mt-2">Setor</label>
                            <input type="text" id="setor" class="form-control">

                            <label for="email" class="form-label mt-2">E-mail</label>
                            <input type="email" id="email" class="form-control">
                        </div>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Cadastrar</button>
                    <button type="button" id="cancelEditBtn" class="btn btn-secondary ms-2" style="display:none;">Cancelar edição</button>
                </form>
            </div>
            <div class="col-md-6">
                <div class="admin-card">
                <h2>Visualizar Dados</h2>
                <ul class="nav nav-tabs" id="tabData">
                    <li class="nav-item">
                        <a class="nav-link active" id="aniversariantes-tab" data-bs-toggle="tab"
                            href="#tabAniversariantes">Aniversariantes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="feriados-tab" data-bs-toggle="tab" href="#tabFeriados">Feriados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="cestas-tab" data-bs-toggle="tab" href="#tabCestas">Datas Cestas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="eventos-tab" data-bs-toggle="tab" href="#tabEventos">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="cardapio-tab" data-bs-toggle="tab" href="#tabCardapio">Cardápio</a>
                    </li>                    <li class="nav-item">
                        <a class="nav-link" id="ramais-tab" data-bs-toggle="tab" href="#tabRamais">Ramais</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="identidade-tab" data-bs-toggle="tab"
                            href="#tabIdentidade">Identidade</a>
                    </li>
                </ul>
                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="tabAniversariantes">
                        <input type="search" class="form-control search-bar" placeholder="Pesquisar aniversariantes..." oninput="filtrarLista(this)" onsearch="filtrarLista(this)">
                        <ul id="aniversariantesList" class="list-group"></ul>
                    </div>
                    <div class="tab-pane fade" id="tabFeriados">
                        <input type="search" class="form-control search-bar" placeholder="Pesquisar feriados..." oninput="filtrarLista(this)" onsearch="filtrarLista(this)">
                        <ul id="feriadosList" class="list-group"></ul>
                    </div>
                    <div class="tab-pane fade" id="tabCestas">
                        <input type="search" class="form-control search-bar" placeholder="Pesquisar datas de cestas..." oninput="filtrarLista(this)" onsearch="filtrarLista(this)">
                        <ul id="cestasList" class="list-group"></ul>
                    </div>
                    <div class="tab-pane fade" id="tabEventos">
                        <input type="search" class="form-control search-bar" placeholder="Pesquisar eventos..." oninput="filtrarLista(this)" onsearch="filtrarLista(this)">
                        <ul id="eventosList" class="list-group"></ul>
                    </div>
                    <div class="tab-pane fade" id="tabCardapio">
                        <input type="search" class="form-control search-bar" placeholder="Pesquisar cardápios..." oninput="filtrarLista(this)" onsearch="filtrarLista(this)">
                        <ul id="cardapioList" class="list-group"></ul>
                    </div>                    <div class="tab-pane fade" id="tabRamais">
                        <input type="search" class="form-control search-bar" placeholder="Pesquisar ramais..." oninput="filtrarLista(this)" onsearch="filtrarLista(this)">
                        <ul id="ramaisList" class="list-group"></ul>
                    </div>

                    <!-- Aba Identidade -->
                    <div class="tab-pane fade" id="tabIdentidade">
                        <input type="search" class="form-control search-bar" placeholder="Pesquisar identidade..." oninput="filtrarLista(this)" onsearch="filtrarLista(this)">
                        <ul id="identidadeList" class="list-group"></ul>
                    </div>
                </div>
                </div>

                <script>
                 
                        const supabaseUrl = 'https://woywqncdfuyworcbjjlv.supabase.co';
                        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndveXdxbmNkZnV5d29yY2Jqamx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUwMTUyNzgsImV4cCI6MjA2MDU5MTI3OH0.o63pZx8l8oe1aEYKEaYVQyHgEvR5FGkfAygTLTvWWVA';
                    
                    if (!window.supabaseClient) {
                        window.supabaseClient = window.supabase.createClient(
                            supabaseUrl,
                            supabaseKey
                        );
                    }

                    var supabase = window.supabaseClient;

                    async function carregarLogotipo() {
                        const { data } = await supabase
                            .from('config_imagens_site')
                            .select('logotipo')
                            .eq('tipo', 'logo_principal')
                            .order('atualizado_em', { ascending: false })
                            .limit(1)
                            .maybeSingle();
                        if (!data || !data.logotipo) return;
                        const img = document.getElementById('logoPrincipal');
                        img.src = data.logotipo.startsWith('data:image') ? data.logotipo : 'data:image/png;base64,' + data.logotipo;
                        img.style.display = 'block';
                        document.getElementById('logoPlaceholder').style.display = 'none';
                    }

                    const cadastroForm = document.getElementById('cadastroForm');
                    const tipoInput = document.getElementById('tipo');
                    const nomeInput = document.getElementById('nome');
                    const dataInput = document.getElementById('data');
                    const imagemInput = document.getElementById('imagem');
                    const aniversariantesList = document.getElementById('aniversariantesList');
                    const feriadosList = document.getElementById('feriadosList');
                    const cestasList = document.getElementById('cestasList');
                    const eventosList = document.getElementById('eventosList');
                    const cardapioList = document.getElementById('cardapioList');
                    const ramaisList = document.getElementById('ramaisList');
                    const identidadeList = document.getElementById('identidadeList');
                    const imagemEventoDiv = document.getElementById('imagemEvento');
                    const imagemCardapioDiv = document.getElementById('imagemCardapio');
                    const imagemCardapioInput = document.getElementById('imagemCardapioInput');
                    const submitBtn = document.getElementById('submitBtn');
                    const cancelEditBtn = document.getElementById('cancelEditBtn');
                    let ramalEditandoId = null;

                    // elementos identidade
                    const logoIdentidadeDiv = document.getElementById('logoIdentidade');
                    const imagemIdentidadeDiv = document.getElementById('imagemIdentidade');
                    const logotipoInput = document.getElementById('logotipo');
                    const imagemDestaqueIdentidadeInput = document.getElementById('imagemDestaqueIdentidade');

                    // Função de filtro
                    function normalizarTexto(valor) {
                        return String(valor || '')
                            .toLowerCase()
                            .normalize('NFD')
                            .replace(/[\u0300-\u036f]/g, '');
                    }

                    function filtrarLista(input) {
                        const termo = normalizarTexto(input.value);
                        const lista = input.closest('.tab-pane').querySelector('.list-group');
                        if (!lista) return;

                        lista.querySelector('.filter-empty')?.remove();

                        const itens = Array.from(lista.querySelectorAll('li:not(.filter-empty)'));
                        let encontrados = 0;

                        itens.forEach(item => {
                            const texto = normalizarTexto(item.dataset.search || item.textContent);
                            const encontrado = texto.includes(termo);
                            item.classList.toggle('filter-hidden', !encontrado);
                            if (encontrado) encontrados++;
                        });

                        if (termo && encontrados === 0) {
                            const li = document.createElement('li');
                            li.className = 'list-group-item filter-empty text-muted';
                            li.textContent = 'Nenhum registro encontrado.';
                            lista.appendChild(li);
                        }
                    }

                    // Adiciona listeners de pesquisa
                    function adicionarFiltros() {
                        document.addEventListener('input', event => {
                            if (event.target.classList.contains('search-bar')) filtrarLista(event.target);
                        });
                        document.addEventListener('search', event => {
                            if (event.target.classList.contains('search-bar')) filtrarLista(event.target);
                        });
                    }

                    // converte arquivo para dataURL (base64)
                    function fileToDataURL(file) {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });
                    }
                    function formatarDataBR(dataISO) {
                        if (!dataISO) return '';
                        const [ano, mes, dia] = dataISO.split('-');
                        return `${dia}/${mes}/${ano}`;
                    }

                    function limparFormularioRamal() {
                        ramalEditandoId = null;
                        submitBtn.textContent = 'Cadastrar';
                        cancelEditBtn.style.display = 'none';
                        nomeInput.value = '';
                        document.getElementById('ramal').value = '';
                        document.getElementById('setor').value = '';
                        document.getElementById('email').value = '';
                    }

                    window.editarRamal = function (item) {
                        ramalEditandoId = item.id;
                        tipoInput.value = 'ramais';
                        tipoInput.dispatchEvent(new Event('change'));
                        nomeInput.value = item.name || '';
                        document.getElementById('ramal').value = item.extension || '';
                        document.getElementById('setor').value = item.department || '';
                        document.getElementById('email').value = item.email || '';
                        submitBtn.textContent = 'Salvar alteração';
                        cancelEditBtn.style.display = 'inline-block';
                        cadastroForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    };

                    cancelEditBtn.addEventListener('click', limparFormularioRamal);
                    window.removerDados = async function (tipo, id) {
                        if (!confirm('Tem certeza que deseja remover este registro?')) return;

                        let tableName = tipo === 'ramais' ? 'employees' : tipo;
                        if (tipo === 'identidade' || tipo === 'cardapio') tableName = 'config_imagens_site';

                        const { error } = await supabase
                            .from(tableName)
                            .delete()
                            .eq('id', id);

                        if (error) {
                            console.error(error);
                            alert('Erro ao remover registro: ' + error.message);
                            return;
                        }

                        alert('Registro removido com sucesso!');
                        if (tipo === 'ramais' && ramalEditandoId === id) {
                            limparFormularioRamal();
                        }
                        carregarDados();
                    };


                    async function carregarDados() {
                        const tipos = ['aniversariantes', 'feriados', 'cestas', 'eventos', 'cardapio', 'ramais', 'identidade'];
                        for (const tipo of tipos) {
                            // mapeia nome da tabela
                            let tableName = tipo === 'ramais' ? 'employees' : tipo;
                            if (tipo === 'identidade' || tipo === 'cardapio') tableName = 'config_imagens_site';

                            let query = supabase.from(tableName).select();
                            if (tipo === 'identidade') query = query.eq('tipo', 'logo_principal');
                            if (tipo === 'cardapio') query = query.eq('tipo', 'cardapio');
                            const { data, error } = await query;
                            if (error) {
                                console.error(`Erro ao carregar ${tipo}:`, error);
                                continue;
                            }

                            const list = tipo === 'aniversariantes' ? aniversariantesList :
                                tipo === 'feriados' ? feriadosList :
                                    tipo === 'cestas' ? cestasList :
                                        tipo === 'eventos' ? eventosList :
                                            tipo === 'cardapio' ? cardapioList :
                                                tipo === 'ramais' ? ramaisList : identidadeList;

                            list.innerHTML = '';
                            if (!data || data.length === 0) {
                                const li = document.createElement('li');
                                li.className = 'list-group-item';
                                li.textContent = `Nenhum dado encontrado para ${tipo}.`;
                                list.appendChild(li);
                            } else {
                                data.forEach(item => {
                                    const li = document.createElement('li');
                                    li.className = 'list-group-item d-flex justify-content-between align-items-center';

                                    if (tipo === 'ramais') {
                                        li.dataset.search = [
                                            item.name,
                                            item.extension,
                                            item.department,
                                            item.email
                                        ].filter(Boolean).join(' ');
                                        li.textContent = `${item.name} - ${item.extension} - ${item.department} - ${item.email}`;
                                    } else if (tipo === 'identidade' || tipo === 'cardapio') {
                                        li.dataset.search = [
                                            item.nome,
                                            item.tipo,
                                            item.descricao
                                        ].filter(Boolean).join(' ');
                                        // item is from config_imagens_site
                                        // item.nome, item.tipo, item.descricao, item.logotipo, item.imagem_destaque
                                        const left = document.createElement('div');
                                        left.innerHTML = `<strong>${item.nome || '(sem nome)'}</strong><br><small>${item.tipo || ''}</small>`;
                                        if (item.descricao) {
                                            left.innerHTML += `<div style="font-size:12px;color:#666;">${item.descricao}</div>`;
                                        }

                                        li.appendChild(left);

                                        const imgs = document.createElement('div');
                                        if (tipo === 'identidade' && item.logotipo) {
                                            const img = document.createElement('img');
                                            img.src = item.logotipo; // já é dataURL
                                            img.alt = 'logotipo';
                                            img.className = 'img-preview';
                                            imgs.appendChild(img);
                                        }
                                        if (item.imagem_destaque) {
                                            const img2 = document.createElement('img');
                                            img2.src = item.imagem_destaque;
                                            img2.alt = 'destaque';
                                            img2.className = 'img-preview';
                                            imgs.appendChild(img2);
                                        }
                                        li.appendChild(imgs);
                                    } else {
                                        li.dataset.search = [
                                            item.nome,
                                            item.data,
                                            formatarDataBR(item.data)
                                        ].filter(Boolean).join(' ');
                                        li.textContent = `${item.nome || ''} - ${formatarDataBR(item.data)}`;
                                        if (item.imagem_url) {
                                            const img = document.createElement('img');
                                            img.src = item.imagem_url;
                                            img.alt = 'Imagem do Evento';
                                            img.className = 'img-thumbnail ms-2';
                                            img.style.width = '50px';
                                            li.appendChild(img);
                                        }
                                    }

                                    const actions = document.createElement('div');
                                    actions.className = 'd-flex gap-2 ms-3';

                                    if (tipo === 'ramais') {
                                        const editBtn = document.createElement('button');
                                        editBtn.className = 'btn btn-primary btn-sm';
                                        editBtn.textContent = 'Editar';
                                        editBtn.onclick = () => editarRamal(item);
                                        actions.appendChild(editBtn);
                                    }

                                    const btn = document.createElement('button');
                                    btn.className = 'btn btn-danger btn-sm';
                                    btn.textContent = 'Remover';
                                    btn.onclick = () => removerDados(tipo, item.id);
                                    actions.appendChild(btn);
                                    li.appendChild(actions);

                                    list.appendChild(li);
                                });
                            }
                        }
                        document.querySelectorAll('.search-bar').forEach(input => {
                            if (input.value.trim()) filtrarLista(input);
                        });
                    }

                    cadastroForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const tipo = tipoInput.value;
                        const nome = nomeInput.value.trim();
                        const data = tipo !== 'ramais' ? dataInput.value : null;
                        const imagem = tipo === 'eventos' ? imagemInput.files[0] : null;
                        const imagemCardapio = tipo === 'cardapio' ? imagemCardapioInput.files[0] : null;
                        const ramal = tipo === 'ramais' ? document.getElementById('ramal').value : null;
                        const setor = tipo === 'ramais' ? document.getElementById('setor').value : null;
                        const email = tipo === 'ramais' ? document.getElementById('email').value : null;

                        // Validações gerais
                        if (!nome) {
                            alert("Por favor, preencha o nome.");
                            return;
                        }

                        // data é obrigatória para todos exceto ramais e identidade
                        if (tipo !== 'ramais' && tipo !== 'identidade' && tipo !== 'cardapio' && !data) {
                            alert("Por favor, informe a data.");
                            return;
                        }

                        // validação ramais
                        if (tipo === 'ramais' && (!ramal || !setor || !email)) {
                            alert("Por favor, preencha ramal, setor e e-mail.");
                            return;
                        }

                        // validação eventos (mantive o comportamento atual: pede imagem)
                        if (tipo === 'eventos' && !imagem) {
                            alert("Por favor, selecione a imagem do evento.");
                            return;
                        }

                        if (tipo === 'cardapio' && !imagemCardapio) {
                            alert("Por favor, selecione a imagem do cardápio.");
                            return;
                        }
                        let dados = {};
                        let error;
                        let successMessage = 'Cadastro realizado com sucesso!';

                        // ===== IDENTIDADE (0, 1 ou 2 imagens aceitas) =====
                        // ===== IDENTIDADE (0, 1 ou 2 imagens aceitas) =====
                        if (tipo === 'identidade') {
                            try {
                                const logoFile = logotipoInput ? logotipoInput.files[0] : null;
                                const destaqueFile = imagemDestaqueIdentidadeInput ? imagemDestaqueIdentidadeInput.files[0] : null;

                                // função auxiliar para converter arquivo -> dataURL (base64)
                                const convertToDataUrl = (file) => {
                                    return new Promise((resolve, reject) => {
                                        if (!file) return resolve(null);
                                        const reader = new FileReader();
                                        reader.onload = () => resolve(reader.result);
                                        reader.onerror = reject;
                                        reader.readAsDataURL(file);
                                    });
                                };

                                const logoDataUrl = await convertToDataUrl(logoFile);
                                const destaqueDataUrl = await convertToDataUrl(destaqueFile);

                                ({ error } = await supabase.from('config_imagens_site').insert([{
                                    nome: nome,
                                    tipo: 'logo_principal',
                                    descricao: 'Identidade cadastrada via painel',
                                    logotipo: logoDataUrl,            // pode ser null
                                    imagem_destaque: destaqueDataUrl, // pode ser null
                                    atualizado_em: new Date()
                                }]));

                                if (error) {
                                    alert('Erro ao cadastrar identidade: ' + error.message);
                                    return;
                                }

                                alert('Identidade cadastrada com sucesso!');
                                // limpar campos relevantes
                                nomeInput.value = '';
                                dataInput.value = '';
                                if (logotipoInput) logotipoInput.value = '';
                                if (imagemDestaqueIdentidadeInput) imagemDestaqueIdentidadeInput.value = '';
                                carregarDados();
                                return;
                            } catch (err) {
                                console.error(err);
                                alert('Erro ao processar imagens da identidade.');
                                return;
                            }
                        }

                        // ===== CARDÁPIO =====
                        if (tipo === 'cardapio') {
                            try {
                                const cardapioDataUrl = await fileToDataURL(imagemCardapio);
                                ({ error } = await supabase.from('config_imagens_site').insert([{
                                    nome: nome,
                                    tipo: 'cardapio',
                                    descricao: 'Cardápio cadastrado via painel',
                                    imagem_destaque: cardapioDataUrl,
                                    atualizado_em: new Date()
                                }]));

                                if (error) {
                                    alert('Erro ao cadastrar cardápio: ' + error.message);
                                    return;
                                }

                                alert('Cardápio cadastrado com sucesso!');
                                nomeInput.value = '';
                                dataInput.value = '';
                                imagemCardapioInput.value = '';
                                carregarDados();
                                return;
                            } catch (err) {
                                console.error(err);
                                alert('Erro ao processar imagem do cardápio.');
                                return;
                            }
                        }
                        // ===== RAMAIS =====
                        if (tipo === 'ramais') {
                            dados = { name: nome, extension: ramal, department: setor, email: email };
                            if (ramalEditandoId) {
                                ({ error } = await supabase
                                    .from('employees')
                                    .update(dados)
                                    .eq('id', ramalEditandoId));
                                successMessage = 'Ramal atualizado com sucesso!';
                            } else {
                                ({ error } = await supabase.from('employees').insert([dados]));
                            }
                        } else {
                            // ===== EVENTOS / ANIVERSARIANTES / FERIADOS / CESTAS =====
                            let imagemUrl = '';
                            if (tipo === 'eventos' && imagem) {
                                // mantemos upload no storage para eventos (como antes)
                                const { data: imagemData, error: imagemError } = await supabase.storage.from('eventos').upload(imagem.name, imagem);
                                if (imagemError) {
                                    alert('Erro ao fazer upload da imagem: ' + imagemError.message);
                                    return;
                                }
                               imagemUrl = `${supabaseUrl}/storage/v1/object/public/eventos/${imagemData.path}`;
                            }

                            dados = { nome, data };
                            if (tipo === 'eventos' && imagemUrl) dados.imagem_url = imagemUrl;
                            ({ error } = await supabase.from(tipo).insert([dados]));
                        }

                        if (error) {
                            alert('Erro ao cadastrar: ' + error.message);
                            return;
                        }

                        alert(successMessage);
                        // limpa campos comuns
                        if (tipo === 'ramais') {
                            limparFormularioRamal();
                        } else {
                            nomeInput.value = '';
                            dataInput.value = '';
                        }
                        if (imagemInput) imagemInput.value = '';
                        carregarDados();
                    });


                    tipoInput.addEventListener('change', () => {
                        const tipo = tipoInput.value;
                        if (tipo !== 'ramais' && ramalEditandoId) {
                            ramalEditandoId = null;
                            submitBtn.textContent = 'Cadastrar';
                            cancelEditBtn.style.display = 'none';
                        }
                        imagemEventoDiv.style.display = 'none';
                        imagemCardapioDiv.style.display = 'none';
                        document.getElementById('dataField').style.display = 'none';
                        document.getElementById('ramalFields').style.display = 'none';
                        logoIdentidadeDiv.style.display = 'none';
                        imagemIdentidadeDiv.style.display = 'none';

                        if (tipo === 'eventos') {
                            imagemEventoDiv.style.display = 'block';
                            document.getElementById('dataField').style.display = 'block';
                        } else if (tipo === 'cardapio') {
                            imagemCardapioDiv.style.display = 'block';                        } else if (tipo === 'ramais') {
                            document.getElementById('ramalFields').style.display = 'block';
                        } else if (tipo === 'identidade') {
                            logoIdentidadeDiv.style.display = 'block';
                            imagemIdentidadeDiv.style.display = 'block';
                        } else {
                            document.getElementById('dataField').style.display = 'block';
                        }
                    });

                    // Inicialização
                    carregarLogotipo();
                    adicionarFiltros();
                    tipoInput.dispatchEvent(new Event('change')); // Atualiza os campos do tipo selecionado ao abrir
                    carregarDados();
                </script>
            </div>
        </div>
    </div>

                <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.min.js"></script>
</body>

</html>
